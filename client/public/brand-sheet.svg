<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="40" y="55" font-family="Montserrat" font-weight="700" font-size="28" fill="#0F172A">SocialSilico — Brand Reference</text>

  <!-- Primary lockup -->
  <g transform="translate(40,90)">
    <g transform="translate(0,0)">
      <line x1="52" y1="52" x2="20" y2="78" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round"/>
      <line x1="52" y1="52" x2="82" y2="22" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round"/>
      <line x1="52" y1="52" x2="22" y2="24" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="20" cy="78" r="7" fill="#4F46E5"/>
      <circle cx="22" cy="24" r="6" fill="#6D28D9"/>
      <circle cx="82" cy="22" r="9" fill="#9333EA"/>
      <circle cx="52" cy="52" r="10" fill="#7C3AED"/>
    </g>
    <text x="118" y="65" font-family="Montserrat" font-weight="700" font-size="52" fill="#0F172A">Social<tspan fill="#7C3AED">Silico</tspan></text>
  </g>

  <!-- Color swatches -->
  <g transform="translate(40,230)">
    <text x="0" y="0" font-family="Montserrat" font-weight="600" font-size="18" fill="#0F172A">Color Palette</text>
    <g transform="translate(0,20)">
      <rect width="110" height="70" rx="10" fill="#4F46E5"/>
      <text x="0" y="90" font-family="Montserrat" font-size="14" fill="#0F172A">Indigo</text>
      <text x="0" y="108" font-family="Montserrat" font-size="13" fill="#475569">#4F46E5</text>
    </g>
    <g transform="translate(140,20)">
      <rect width="110" height="70" rx="10" fill="#7C3AED"/>
      <text x="0" y="90" font-family="Montserrat" font-size="14" fill="#0F172A">Violet</text>
      <text x="0" y="108" font-family="Montserrat" font-size="13" fill="#475569">#7C3AED</text>
    </g>
    <g transform="translate(280,20)">
      <rect width="110" height="70" rx="10" fill="#9333EA"/>
      <text x="0" y="90" font-family="Montserrat" font-size="14" fill="#0F172A">Purple</text>
      <text x="0" y="108" font-family="Montserrat" font-size="13" fill="#475569">#9333EA</text>
    </g>
    <g transform="translate(420,20)">
      <rect width="110" height="70" rx="10" fill="#0F172A"/>
      <text x="0" y="90" font-family="Montserrat" font-size="14" fill="#0F172A">Ink</text>
      <text x="0" y="108" font-family="Montserrat" font-size="13" fill="#475569">#0F172A</text>
    </g>
    <g transform="translate(560,20)">
      <rect width="110" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="0" y="90" font-family="Montserrat" font-size="14" fill="#0F172A">Cloud</text>
      <text x="0" y="108" font-family="Montserrat" font-size="13" fill="#475569">#F8FAFC</text>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(40,400)">
    <text x="0" y="0" font-family="Montserrat" font-weight="600" font-size="18" fill="#0F172A">Typography — Montserrat</text>
    <text x="0" y="35" font-family="Montserrat" font-weight="800" font-size="22" fill="#0F172A">ExtraBold / Bold for headings &amp; wordmark</text>
    <text x="0" y="65" font-family="Montserrat" font-weight="500" font-size="20" fill="#475569">Medium / Regular for body text and UI</text>
  </g>
</svg>
